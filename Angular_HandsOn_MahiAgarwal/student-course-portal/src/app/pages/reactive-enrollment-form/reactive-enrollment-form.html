<div style="padding: 20px; font-family: sans-serif; max-width: 450px;">
  <h2>Reactive Student Enrollment Form</h2>
  
  <form [formGroup]="enrollForm" (ngSubmit)="onSubmit()" style="display: flex; flex-direction: column; gap: 15px;">
    
    <div>
      <label style="display: block; margin-bottom: 5px; font-weight: bold;">Student Name:</label>
      <input type="text" formControlName="studentName" style="padding: 8px; width: 100%; border: 1px solid #ccc; border-radius: 4px;" />
    </div>

    <div>
      <label style="display: block; margin-bottom: 5px; font-weight: bold;">Student Email:</label>
      <input type="email" formControlName="studentEmail" style="padding: 8px; width: 100%; border: 1px solid #ccc; border-radius: 4px;" />
      <span *ngIf="enrollForm.get('studentEmail')?.errors?.['emailTaken']" style="color: red; font-size: 0.85rem; display: block; margin-top: 4px;">Email is already taken.</span>
    </div>

    <div>
      <label style="display: block; margin-bottom: 5px; font-weight: bold;">Course ID / Code:</label>
      <input type="text" formControlName="courseId" style="padding: 8px; width: 100%; border: 1px solid #ccc; border-radius: 4px;" />
      <span *ngIf="enrollForm.get('courseId')?.errors?.['noCourseCode']" style="color: red; font-size: 0.85rem; display: block; margin-top: 4px;">Course code starting with XX is not allowed.</span>
    </div>

    <div>
      <label style="display: block; margin-bottom: 5px; font-weight: bold;">Preferred Semester:</label>
      <select formControlName="preferredSemester" style="padding: 8px; width: 100%; border: 1px solid #ccc; border-radius: 4px;">
        <option value="">-- Select Semester --</option>
        <option value="Odd">Odd</option>
        <option value="Even">Even</option>
      </select>
    </div>

    <div style="margin-top: 10px; padding: 10px; border: 1px dashed #ccc; border-radius: 4px;">
      <label style="font-weight: bold; display: block; margin-bottom: 10px;">Additional Courses:</label>
      
      <div formArrayName="additionalCourses" style="display: flex; flex-direction: column; gap: 10px;">
        <div *ngFor="let ctrl of additionalCourses.controls; let i = index" style="display: flex; gap: 10px; align-items: center;">
          <input [formControlName]="i" placeholder="Enter course code" style="padding: 6px; flex: 1; border: 1px solid #ccc; border-radius: 4px;" />
          <button type="button" (click)="removeCourse(i)" style="padding: 6px 12px; background-color: #dc3545; color: white; border: none; border-radius: 4px; cursor: pointer;">
            Remove
          </button>
        </div>
      </div>

      <button type="button" (click)="addCourse()" style="margin-top: 10px; padding: 6px 12px; background-color: #17a2b8; color: white; border: none; border-radius: 4px; cursor: pointer;">
        Add Another Course
      </button>
    </div>

    <div style="display: flex; align-items: center; gap: 8px; margin-top: 5px;">
      <input type="checkbox" formControlName="agreeToTerms" style="cursor: pointer;" />
      <label>I agree to the terms and conditions</label>
    </div>

    <button type="submit" [disabled]="enrollForm.invalid" style="padding: 10px; background-color: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 1rem;">
      Submit
    </button>

  </form>
</div>
