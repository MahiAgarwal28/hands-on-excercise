<div style="padding: 20px; font-family: sans-serif;">
  <div *ngIf="errorMessage" style="color: red; font-weight: bold; margin-bottom: 10px;">
    {{ errorMessage }}
  </div>

  <div *ngIf="course" style="border: 1px solid #ccc; padding: 20px; border-radius: 6px; max-width: 400px; background-color: #fff;">
    <h2 style="margin-top: 0; color: #007bff;">{{ course.name }}</h2>
    <p><strong>Course ID:</strong> {{ course.id }}</p>
    <p><strong>Code System:</strong> {{ course.code }}</p>
    <p><strong>Credits Value:</strong> {{ course.credits }}</p>
    <p><strong>Current Grade Status:</strong> {{ course.gradeStatus }}</p>
    
    <h3 style="margin-top: 20px; border-top: 1px solid #eee; padding-top: 10px;">Enrolled Students:</h3>
    <p *ngIf="students.length === 0" style="color: #666;">No students found in this course module.</p>
    <ul *ngIf="students.length > 0">
      <li *ngFor="let s of students">{{ s.name }} (ID: {{ s.id }})</li>
    </ul>

    <button routerLink="/courses" style="margin-top: 15px; padding: 8px 16px; background-color: #6c757d; color: white; border: none; border-radius: 4px; cursor: pointer;">
      Back to Courses List
    </button>
  </div>
</div>
